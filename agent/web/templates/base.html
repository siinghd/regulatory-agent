<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<meta name="color-scheme" content="light dark">
<title>{% block title %}Regulatory filings{% endblock %}</title>
<link rel="stylesheet" href="{{ static_url('viewer.css') }}">
{% block head %}{% endblock %}
</head>
<body>
<header class="site">
  <div class="wrap">
    <span class="brand">Regulatory filings</span>
    <span class="tagline">source viewer</span>
  </div>
</header>
<main class="wrap">
{% block main %}{% endblock %}
</main>
<footer class="site">
  <div class="wrap">
    Documents are public records of utility regulators, retrieved from their public portals.
    Summaries are machine-written; each claim links to the passage it comes from.
    <a href="/privacy">Privacy notice</a> · <a href="/status">Service status</a>
  </div>
</footer>
</body>
</html>
