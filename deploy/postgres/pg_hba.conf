# Client authentication for the agent's Postgres (mounted read-only by docker-compose.yml).
# First matching line wins.
#
# Unix socket: reachable only from inside the container (`docker compose exec postgres ...`).
# Docker access is root-equivalent on this host, so the socket is the break-glass path and the
# one backup.sh uses; it is trusted.
# TYPE  DATABASE  USER                                                          ADDRESS  METHOD
local   all       all                                                                    trust

# The bootstrap superuser never authenticates over the network, whatever the password.
host    all       agent                                                         all      reject

# Application roles, password (SCRAM) only, only to the agent database. Clients arrive from the
# Docker bridge gateway (Postgres is published on 127.0.0.1:5442 only).
host    agent     agent_app,agent_web,agent_migrator,agent_retention,agent_backup   all      scram-sha-256

# Everything else: no.
host    all       all                                                           all      reject
