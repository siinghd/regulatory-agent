# Redis for the regulatory agent: arq queue, rate limits, locks. Mounted read-only by
# docker-compose.yml; users come from /run/redis/users.acl, rendered at start-up by
# deploy/redis/entrypoint.sh from users.acl.template and the passwords in .env.

# Users and permissions (default user disabled; see users.acl.template). `ACL LOAD` re-reads it.
aclfile /run/redis/users.acl
# Defence in depth: should the default user ever be re-enabled without a password, refuse
# non-loopback clients instead of serving them.
protected-mode yes

# Durability: the queue is the only copy of "work to do" between ingest and the worker. The
# sweeper re-enqueues from Postgres after a loss, but an fsync'd AOF makes that the exception.
appendonly yes
appendfsync everysec
dir /data

# Never silently evict queue entries or locks: at the limit, writes fail loudly instead.
# (Live usage is ~2 MB; the container's mem_limit leaves headroom above this.)
maxmemory 256mb
maxmemory-policy noeviction

# Operational logging: a slow command log and an ACL denial log to check after deploys
# (`ACL LOG` as admin; deploy/compliance_check.sh reports it).
slowlog-log-slower-than 10000
acllog-max-len 256
loglevel notice
