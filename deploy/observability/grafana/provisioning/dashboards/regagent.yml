# Dashboards as code: deploy/observability/grafana/dashboards/*.json (generated by
# build_dashboards.py). Read-only in the UI; edit the generator and re-run it instead.
apiVersion: 1
providers:
  - name: regagent
    orgId: 1
    folder: Regulatory Document Agent
    folderUid: regagent
    type: file
    disableDeletion: true
    allowUiUpdates: false
    updateIntervalSeconds: 60
    options:
      path: /etc/grafana/dashboards
